[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -Iinclude
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -include ForgeArduinoCompat.h

lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    h2zero/NimBLE-Arduino@2.5.0
    ESP-PN532BLE=https://github.com/whywilson/ESP-PN532BLE

; Simulateur desktop SDL : lance l'UI sur macOS sans flasher.
; Prerequis : brew install sdl2
; Usage     : pio run -e sim -t exec
; Perimetre : core + ui + apps home/settings/charge/placeholder.
;             L'app NFC est exclue (SD, SPI, Serial1, BLE, USB host).
[env:sim]
platform = native
build_type = debug

build_flags =
    -xc++
    -std=gnu++17
    -O0
    -arch arm64
    -I sim/compat
    -I "${sysenv.HOMEBREW_PREFIX}/include/SDL2"
    -L "${sysenv.HOMEBREW_PREFIX}/lib"
    -lSDL2
    -DM5GFX_BOARD=lgfx::board_t::board_M5Cardputer
    -DM5GFX_SCALE=3
    -DM5GFX_SHOW_FRAME
    -DM5GFX_BACK_COLOR=0x222222u

build_src_filter =
    +<core/>
    +<ui/>
    +<apps/home/>
    +<apps/settings/>
    +<apps/charge/>
    +<apps/placeholder/>
    +<../sim/>

lib_deps =
    m5stack/M5GFX
