[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -Iinclude
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -include ForgeArduinoCompat.h

lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    h2zero/NimBLE-Arduino@2.5.0
    ESP-PN532BLE=https://github.com/whywilson/ESP-PN532BLE
